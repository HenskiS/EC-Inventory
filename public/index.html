<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EC Inventory - Cash Discount App</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>EC Inventory</h1>
            <div class="header-actions">
                <button id="barcode-scanner-page-btn" class="btn-secondary">Barcode Scanner</button>
                <button id="saved-orders-btn" class="btn-secondary">Saved Orders</button>
                <button id="new-order-btn" class="btn-primary">New Order</button>
            </div>
        </header>

        <main>
            <div id="search-section" class="section">
                <div class="search-box">
                    <input type="text" id="search-input" placeholder="Search by brand, name, SKU, or barcode..." autocomplete="off">
                    <button id="barcode-scan-btn" class="barcode-scan-btn" title="Scan barcode">📷</button>
                    <button id="clear-search-btn" class="clear-search-btn" title="Clear search">✕</button>
                </div>
                <div class="search-filters">
                    <div class="filter-group">
                        <label for="brand-filter">Brand:</label>
                        <select id="brand-filter" class="filter-select">
                            <option value="">All Brands</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label for="sku-filter">SKU Contains:</label>
                        <input type="text" id="sku-filter" class="filter-input" placeholder="SKU...">
                    </div>
                    <div class="filter-group">
                        <label for="price-min">Min Price:</label>
                        <input type="number" id="price-min" class="filter-input price-input" placeholder="$0" min="0" step="0.01">
                    </div>
                    <div class="filter-group">
                        <label for="price-max">Max Price:</label>
                        <input type="number" id="price-max" class="filter-input price-input" placeholder="$999" min="0" step="0.01">
                    </div>
                    <div class="filter-group">
                        <button id="clear-filters-btn" class="btn-secondary btn-small">Clear Filters</button>
                    </div>
                </div>
            </div>

            <div class="main-content">
                <div class="left-panel">
                    <div id="search-results" class="search-results-panel">
                        <div class="panel-header">Search Results</div>
                        <div id="search-results-list" class="search-results-list"></div>
                    </div>
                </div>

                <div class="right-panel">
                    <div id="cart-section" class="cart-panel">
                        <div class="cart-header">
                            <div class="panel-header">Current Order</div>
                            <div class="discount-controls">
                                <label class="discount-toggle">
                                    <input type="checkbox" id="discount-enabled" checked>
                                    <span class="slider"></span>
                                    <span class="discount-label">Cash Discount:</span>
                                </label>
                                <input type="number" id="discount-rate" value="40" min="0" max="100">
                                <span>%</span>
                            </div>
                </div>
                <div id="cart-items" class="cart-items"></div>
                <div class="cart-totals">
                    <div class="total-row">
                        <span>Subtotal:</span>
                        <span id="subtotal">$0.00</span>
                    </div>
                    <div class="total-row discount-row">
                        <span id="discount-label">Cash Discount (40%):</span>
                        <span id="discount-amount">-$0.00</span>
                    </div>
                    <div class="total-row final-total">
                        <span>Cash Total:</span>
                        <span id="cash-total">$0.00</span>
                    </div>
                </div>
                <div class="cart-actions">
                    <button id="save-order-btn" class="btn-primary">Save Order</button>
                    <button id="clear-cart-btn" class="btn-secondary">Clear Cart</button>
                </div>
                    </div>
                </div>
            </div>

            <div id="orders-section" class="section hidden">
                <div class="orders-header">
                    <h3>Saved Orders</h3>
                    <button id="back-to-search-btn" class="btn-secondary">Back to Search</button>
                </div>
                <div id="saved-orders-list" class="saved-orders"></div>
            </div>
        </main>
    </div>

    <!-- Barcode Scanner Modal -->
    <div id="barcode-modal" class="barcode-modal hidden">
        <div class="barcode-modal-content">
            <div class="barcode-modal-header">
                <h3>Scan Barcode</h3>
                <button id="close-barcode-btn" class="close-barcode-btn">✕</button>
            </div>
            <div id="barcode-scanner" class="barcode-scanner"></div>
            <div class="barcode-instructions">
                Position the barcode within the frame and hold steady
            </div>
        </div>
    </div>

    <div id="notification" class="notification hidden"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/quagga/0.12.1/quagga.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
